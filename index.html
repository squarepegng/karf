<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kerf — interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--canvas:#1B1B1E;--panel:#232327;--raised:#2D2D32;--line:#3A3A40;--ink:#EDEDF0;--ink2:#B0B0BA;--ink3:#8B8B95;--select:#2B66D9;--intent:#E9B547;--danger:#F06A5F;--tipbg:#EDEDF0;--tipink:#1B1B1E;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--canvas:#1B1B1E;--panel:#232327;--raised:#2D2D32;--line:#3A3A40;--ink:#EDEDF0;--ink2:#B0B0BA;--ink3:#8B8B95;color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#1B1B1E;--panel:#232327;--raised:#2D2D32;--line:#3A3A40;--ink:#EDEDF0;--ink2:#B0B0BA;--ink3:#8B8B95}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--canvas);color:var(--ink);font:400 12px/16px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--select);outline-offset:2px}
.mono{font:400 11px/16px 'Geist Mono',ui-monospace,'SF Mono',monospace}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
/* top bar */
.top{flex:0 0 48px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .side{display:flex;align-items:center;gap:10px;flex:1 1 0;min-width:0}
.top .side.r{justify-content:flex-end;gap:8px}
.chip{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:4px;color:var(--ink2);white-space:nowrap}
.ghost{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:transparent;border:0;border-radius:6px;color:var(--ink)}
.ghost:hover{background:var(--raised)}
.icon{width:28px;height:28px;display:grid;place-items:center;background:transparent;border:0;border-radius:6px;position:relative}
.icon:hover,.icon[aria-pressed="true"]{background:var(--raised)}
.dot{width:6px;height:6px;border-radius:3px;background:var(--intent);flex:0 0 auto}
.badgeDot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:4px;background:var(--intent);box-shadow:0 0 0 2px var(--panel)}
.primary{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 10px;background:var(--select);border:0;border-radius:6px;color:var(--ink);font-weight:500;white-space:nowrap}
.primary .count{min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;border-radius:4px;background:rgba(255,255,255,.18);font-size:11px}
.primary.solo{padding:0 14px;height:32px}
.light{height:28px;padding:0 12px;background:var(--ink);border:0;border-radius:6px;color:var(--canvas);font-weight:500;white-space:nowrap}
.outline{height:28px;padding:0 12px;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--ink);font-weight:500;white-space:nowrap}
.outline:hover{background:var(--raised)}
.amberBtn{height:28px;padding:0 12px;background:var(--intent);border:0;border-radius:6px;color:var(--canvas);font-weight:500}
.dangerText{height:28px;padding:0 10px;background:transparent;border:0;border-radius:6px;color:var(--danger);font-weight:500}
/* layout */
.body{flex:1 1 auto;min-height:0;display:flex}
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.panel.l{flex:0 0 248px;border-right:1px solid var(--line)}
.panel.r{flex:0 0 300px;border-left:1px solid var(--line)}
.panel.r.wide{flex-basis:320px}
.tabs{display:flex;gap:16px;padding:12px 12px 0;height:40px;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs button{background:none;border:0;padding:0 0 10px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink3);display:flex;gap:6px;align-items:flex-start}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.kbd{padding:0 4px;height:16px;border-radius:4px;background:var(--raised);color:var(--ink2);font:400 11px/16px 'Geist Mono',ui-monospace,monospace}
.stage{flex:1 1 auto;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;padding:16px 28px 0}
.stageMeta{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px;color:var(--ink3);gap:12px}
.stageMeta .lft{display:flex;align-items:center;gap:8px;min-width:0}
.frameWrap{width:100%;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;overflow:hidden;background:#F7F6F3}
.frame{height:100%;overflow:auto;position:relative;scrollbar-width:thin}
.fc{position:relative;min-height:100%}
.edit .fc [data-k]{cursor:default}
.edit.tool-select .fc [data-k]:hover{outline:1px solid rgba(43,102,217,.6);outline-offset:2px}
.tool-hand .frame{cursor:grab}
.fc .sel{outline:1.5px solid var(--select)!important;outline-offset:3px}
.fc .inst{outline:1px dashed rgba(43,102,217,.55);outline-offset:3px}
.selLabel{position:absolute;padding:2px 6px;background:var(--select);border-radius:4px;color:var(--ink);font:500 11px/14px 'Geist',system-ui,sans-serif;white-space:nowrap;pointer-events:none;z-index:3}
/* floating toolbar */
.toolbar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;background:var(--raised);border:1px solid var(--line);border-radius:14px;z-index:20}
.tb{width:40px;height:40px;display:grid;place-items:center;background:transparent;border:0;border-radius:8px;position:relative}
.tb:hover{background:var(--line)}
.tb.on{background:var(--select)}
.tb.chev{width:16px;margin-left:-2px;border-radius:6px}
.tbDiv{width:1px;height:32px;margin:0 6px;background:var(--line)}
.modes{display:flex;gap:2px;padding:2px;background:var(--canvas);border-radius:10px}
.modes .tb{width:36px;height:36px;border-radius:7px}
.modes .tb.on{background:var(--line)}
.tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;background:var(--tipbg);color:var(--tipink);font:500 12px/16px 'Geist',system-ui,sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease}
.tip .k{color:#55555D;font:400 11px/16px 'Geist Mono',ui-monospace,monospace}
.tb:hover .tip,.tb:focus-visible .tip{opacity:1}
.pop{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:25}
.flyout{position:absolute;bottom:calc(100% + 8px);display:flex;gap:2px;padding:4px;background:var(--raised);border:1px solid var(--line);border-radius:10px}
.flyout .tb{width:32px;height:32px;border-radius:6px}
.menuItem{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;background:transparent;border:0;border-radius:6px;text-align:left;color:var(--ink)}
.menuItem:hover{background:var(--raised)}
/* panels content */
.sec{display:flex;flex-direction:column;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.secT{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.01em;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:8px}
.lab{color:var(--ink3)}
.field{display:flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 8px;background:var(--raised);border:1px solid transparent;border-radius:4px}
.field:focus-within{border-color:var(--select)}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--ink)}
.field.changed{box-shadow:inset 0 0 0 1px var(--intent)}
.step{width:20px;height:20px;display:grid;place-items:center;background:transparent;border:0;border-radius:3px;color:var(--ink3)}
.step:hover{background:var(--line);color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:2px;background:var(--canvas);border:1px solid var(--line);border-radius:6px}
.seg button{height:22px;background:transparent;border:0;border-radius:4px;color:var(--ink2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.layer{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px;border-radius:4px;background:transparent;border:0;width:100%;text-align:left;color:var(--ink2)}
.layer:hover{background:var(--raised)}
.layer.on{background:rgba(43,102,217,.24);color:var(--ink);font-weight:500}
.empty{padding:20px 14px;color:var(--ink3);line-height:18px}
.path{display:flex;align-items:center;gap:6px;color:var(--ink2)}
/* chat */
.chatScroll{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:16px 14px}
.uMsg{align-self:flex-end;max-width:250px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bubble{padding:8px 10px;background:var(--raised);border-radius:10px 10px 4px 10px;line-height:18px}
.ctx{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;border:1px solid var(--select);border-radius:4px;font:500 11px/14px 'Geist',system-ui,sans-serif}
.ctx i{width:6px;height:6px;border-radius:1px;background:var(--select)}
.kMsg{display:flex;flex-direction:column;gap:10px;line-height:18px}
.who{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.plan{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:6px}
.plan div{display:flex;gap:8px}.plan .dot{margin-top:6px}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:left;padding:8px 10px;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--ink2);line-height:16px}
.sugg button:hover{color:var(--ink);background:var(--raised)}
.composer{padding:12px;border-top:1px solid var(--line)}
.compBox{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--canvas);border:1px solid var(--line);border-radius:10px}
.compBox:focus-within{border-color:#55555D}
.compBox textarea{width:100%;padding:0;background:transparent;border:0;outline:none;resize:none;line-height:18px}
.typing{display:flex;gap:4px}.typing i{width:5px;height:5px;border-radius:3px;background:var(--ink3);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
/* store */
.nf{font-family:'Hanken Grotesk',system-ui,sans-serif;color:#1A1A1A;background:#F7F6F3;min-height:100%}
.nf-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 40px;border-bottom:1px solid #E6E3DD}
.nf-logo{font-size:19px;line-height:24px;font-weight:600;letter-spacing:-.02em}
.nf-links{display:flex;gap:28px;font-size:14px;line-height:20px;color:#4A4744}
.nf-links span:first-child{color:#1A1A1A;font-weight:500}
.nf-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:36px 40px 28px}
.nf-hero h1{margin:0;line-height:1.1;font-weight:600;letter-spacing:-.03em}
.nf-hero p{margin:8px 0 0;font-size:15px;line-height:22px;color:#5C5853}
.nf-chips{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;line-height:18px}
.nf-chips button{padding:7px 14px;border-radius:999px;border:1px solid #D9D5CE;background:transparent;color:#1A1A1A;font-family:inherit}
.nf-chips button.on{background:#1A1A1A;color:#F7F6F3;border-color:#1A1A1A}
.nf-chips.quiet button{padding:4px 10px;font-size:12px;color:#5C5853}
.nf-chips.quiet button.on{background:transparent;color:#1A1A1A;border-color:#1A1A1A}
.nf-grid{display:grid;gap:20px;padding:0 40px 120px}
.nf-card{display:flex;flex-direction:column;background:#FFFFFF;border-radius:12px}
.nf-img{position:relative;height:220px}
.nf-badge{position:absolute;left:10px;top:10px;padding:3px 8px;border-radius:999px;background:#1A1A1A;color:#F7F6F3;font-size:11px;line-height:14px;font-weight:600}
.nf-text{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.nf-price{font-size:16px;line-height:22px;font-weight:600}
.nf-title{font-size:14px;line-height:20px;color:#5C5853}
.nf-title.dark{color:#2E2B28}
.nf-stars{display:flex;gap:2px;margin-top:4px;width:max-content}
.nf-btn{height:40px;border-radius:8px;border:1px solid #1A1A1A;background:transparent;color:#1A1A1A;font:500 14px/20px 'Hanken Grotesk',system-ui,sans-serif}
.nf-btn.solid{background:#1A1A1A;color:#F7F6F3}
.preview .nf-btn:hover{background:#1A1A1A;color:#F7F6F3}
.preview .nf-btn.solid:hover{background:#33302D}
.narrow .nf-nav,.narrow .nf-hero{padding-left:20px;padding-right:20px}
.narrow .nf-grid{padding-left:20px;padding-right:20px;gap:12px}
.narrow .nf-links{gap:14px;font-size:13px}
.narrow .nf-img{height:150px}
/* annotations */
.anno{position:absolute;inset:0;z-index:4;pointer-events:none}
.tool-annotate .anno{pointer-events:auto;cursor:crosshair}
.pin{position:absolute;display:grid;place-items:center;width:24px;height:24px;border-radius:12px 12px 12px 3px;background:var(--select);color:var(--ink);font:600 11px/16px 'Geist',system-ui,sans-serif;pointer-events:auto}
.noteTag{position:absolute;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:400 12px/16px 'Geist',system-ui,sans-serif;max-width:240px;pointer-events:none}
.notePop{position:absolute;width:320px;display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:400 12px/16px 'Geist',system-ui,sans-serif;z-index:6;pointer-events:auto;cursor:default}
.notePop textarea{width:100%;min-height:56px;padding:8px 10px;background:var(--raised);border:1px solid transparent;border-radius:6px;outline:none;resize:none;line-height:18px;font-size:13px}
.notePop textarea:focus{border-color:var(--select)}
.interp{display:flex;align-items:flex-start;gap:8px;padding:10px;background:rgba(233,181,71,.1);border:1px solid rgba(233,181,71,.35);border-radius:6px}
.interp .dot{margin-top:5px}
.wave{display:flex;align-items:center;gap:2px;height:16px}
.wave i{width:2px;border-radius:1px;background:var(--ink2);animation:w .9s ease-in-out infinite}
@keyframes w{0%,100%{height:4px}50%{height:15px}}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}
/* floating cards */
.float{position:absolute;left:50%;transform:translateX(-50%);z-index:15;background:var(--raised);border:1px solid var(--line);border-radius:10px}
.banner{top:12px;display:flex;align-items:center;gap:10px;height:32px;padding:0 6px 0 12px;white-space:nowrap}
.rule{bottom:92px;width:420px;max-width:calc(100% - 48px);display:flex;flex-direction:column;gap:10px;padding:12px}
.toast{bottom:92px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;max-width:calc(100% - 48px)}
.ask{bottom:92px;width:440px;max-width:calc(100% - 48px);padding:10px;display:flex;flex-direction:column;gap:10px}
.notesChip{position:absolute;right:32px;bottom:20px;display:flex;align-items:center;gap:4px;height:54px;padding:0 7px 0 14px;background:var(--raised);border:1px solid var(--line);border-radius:14px;z-index:20;white-space:nowrap}
.hint{position:absolute;left:32px;bottom:28px;color:var(--ink3);z-index:10;max-width:260px;line-height:16px}
/* history */
.cmp{position:relative;width:100%;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;overflow:hidden;background:#F7F6F3}
.cmp .layerA,.cmp .layerB{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cmpLine{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);pointer-events:none}
.cmpKnob{position:absolute;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;display:grid;place-items:center;background:var(--ink);border-radius:18px;pointer-events:none}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmpTag{position:absolute;top:14px;padding:3px 8px;border-radius:4px;background:rgba(27,27,30,.86);color:var(--ink);font:500 11px/14px 'Geist',system-ui,sans-serif;pointer-events:none}
.sbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;flex:1 1 auto;min-height:0}
.sbs > div{position:relative;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;overflow:hidden;background:#F7F6F3}
.ver{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:transparent;border:0;text-align:left;width:100%;color:var(--ink)}
.ver:hover{background:var(--raised)}
.ver.on{background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--select)}
.srcTag{padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink2);font-size:11px}
/* modal */
.scrim{position:absolute;inset:0;display:grid;place-items:center;background:rgba(12,12,14,.62);padding:24px;z-index:40}
.dialog{width:520px;max-width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.dialog label{display:flex;flex-direction:column;gap:6px}
.dialog input[type=text],.dialog textarea{padding:8px 10px;background:var(--raised);border:1px solid transparent;border-radius:4px;outline:none;line-height:18px;resize:none}
.dialog input[type=text]:focus,.dialog textarea:focus{border-color:var(--select)}
.mobileNote{display:none}
.sw{display:flex;flex-wrap:wrap;gap:5px}
.sw button{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--select)}
.corners{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.corners .field{padding:0 4px}
.dropLine{position:absolute;background:var(--select);border-radius:2px;pointer-events:none;z-index:5}
.fc [contenteditable="true"]{outline:1.5px solid var(--select)!important;outline-offset:3px;cursor:text}
.dragging{opacity:.45}
.edit .fc{user-select:none;-webkit-user-select:none}
.edit .fc [contenteditable="true"]{user-select:text;-webkit-user-select:text}
.edit.tool-select .fc .nf-card,.edit.tool-select .fc [data-k="price"],.edit.tool-select .fc [data-k="title"]{touch-action:none}
@media (max-width: 900px){
 .panel.l{display:none}.panel.r{position:absolute;right:0;top:48px;bottom:0;z-index:30;flex-basis:auto;width:min(320px,90vw)}
 .stage{padding:12px 12px 0}.top .hideS{display:none}
 .mobileNote{display:block;position:absolute;left:12px;right:12px;top:56px;z-index:50;padding:10px 12px;background:var(--raised);border:1px solid var(--line);border-radius:8px;color:var(--ink2)}
 .notesChip{right:12px;bottom:84px}.hint{display:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" aria-live="off"></div>
<script>
(function(){
'use strict';
var PRODUCTS=[
 {name:'Linen overshirt',price:'$86',tone:'#CDBFAE',cat:'Shirts'},
 {name:'Canvas tote',price:'$34',tone:'#A9AE96',cat:'Accessories'},
 {name:'Merino crew',price:'$72',tone:'#98A3AE',cat:'Knitwear'},
 {name:'Waxed cap',price:'$28',tone:'#D8CDB8',cat:'Accessories'},
 {name:'Wool scarf',price:'$48',tone:'#B9AA9C',cat:'Knitwear'},
 {name:'Field trousers',price:'$94',tone:'#8F978A',cat:'Trousers'},
 {name:'Cord shirt',price:'$78',tone:'#C2B6A2',cat:'Shirts'},
 {name:'Leather belt',price:'$42',tone:'#A1988E',cat:'Accessories'}
];
var CATS=['All','Shirts','Knitwear','Trousers','Accessories'];
var BASE={cardGap:24,cardPad:12,imgRadius:8,priceFirst:false,rating:false,titleDark:false,button:'outline',headingSize:40,chipsQuiet:false,badge:false,ov:{},text:{},cardOrder:[0,1,2,3,4,5,6,7]};
var META={

function validate(key,val){

 if(typeof b==='number'){var n=Math.round(Number(val));if(!isFinite(n))return undefined;var L=LIMITS[key];return Math.max(L[0],Math.min(L[1],n))}

 'Settings and allowed values: cardGap (number 0-48, space between items inside a product card), cardPad (number 0-32), imgRadius (number 0-32, product image corner radius), priceFirst (boolean, price shown above the title), rating (boolean, star rating under the title), titleDark (boolean, darker product title), button ("outline" or "solid", the Add to cart buttons), headingSize (number 24-72, page heading px), chipsQuiet (boolean, quieter filter chips), badge (boolean, New badge on images).\n'+
 'Current values: '+JSON.stringify(S.store)+'\nSelected element: '+(sel?NAMES[sel]:'none')+'\n'+
 'If the request needs behaviour, data, payments, checkout logic, accounts or backend work, set scope true and changes {}. Only include settings that should change. If nothing fits, return {"scope":false,"changes":{}}.\nRequest: '+JSON.stringify(text);
 return sampleFn.json(prompt,{modelTier:'quick',cache:false}).then(function(r){
  if(!r||typeof r!=='object')return local;

  var ch={};Object.keys(r.changes||{}).forEach(function(k){var v=validate(k,r.changes[k]);if(v!==undefined&&v!==S.store[k])ch[k]=v});

}

 var v={n:S.versions.length+1,time:now(),changes:labels,store:clone(S.store),source:source||'ai',title:title};

}

function decorate(){
 if(S.mode!=='edit'||!S.sel||S.view!=='canvas')return;
 var fc=document.getElementById('fc');if(!fc)return;
 var k=S.sel.k,i=S.sel.i;
 var els=fc.querySelectorAll('[data-k="'+k+'"]');var target=null;
 els.forEach(function(el){if(i==null||el.getAttribute('data-i')===String(i)){if(!target)target=el}});

function setMode(m){
 if(m===S.mode)return;
 if(m==='preview'){finalizeDraft();S.sel=null;S.tool='interact';S.rule=false}else{S.tool='select';S.ask=false}
 S.mode=m;S.insert=false;S.flyout=false;S.view='canvas';S.noteDraft=null;render();
}
function showToast(text,n){S.toast={text:text,n:n};clearTimeout(showToast.t);showToast.t=setTimeout(function(){S.toast=null;if(S.view==='canvas')render()},9000)}
function runRequest(text,where){
 text=(text||'').trim();if(!text||S.busy)return;
 var sel=S.sel&&S.sel.k;
 if(where==='chat')S.chat.push({role:'user',text:text,ctx:sel?NAMES[sel]:null});
 S.busy=true;render();
 var usedAI=!!sampleFn;
 Promise.all([aiIntents(text,sel),new Promise(function(r){setTimeout(r,650)})]).then(function(res){
  var r=res[0];S.busy=false;
  if(r.scope){
   if(where==='chat')S.chat.push({role:'kerf',kind:'scope',ai:usedAI,text:text});
   else showToast('That changes how the shop works, so it’s one for your developers. Open Chat in Edit to note it in the PR.');
   S.ask=false;render();return;
  }
  var out=applyAI(r.changes||{},'ai');
  if(!out){
   if(where==='chat')S.chat.push({role:'kerf',kind:'none',ai:usedAI});
   else showToast('Kerf couldn’t map that yet. Try cards, ratings, buttons, the heading or filter chips.');
   S.ask=false;render();return;
  }
  var lead=out.where.some(function(w){return /4 screens/.test(w)})?'ProductCard is used on 4 screens, so this changes all of them. Here’s what I did:':'Here’s what I changed:';
  if(where==='chat')S.chat.push({role:'kerf',kind:'applied',ai:usedAI,labels:out.labels,n:out.n,lead:lead});
  else showToast(out.labels.join(' · '),out.n);
  S.ask=false;render();
 });
}
function addNote(){
 var ta=document.getElementById('noteText');var t=ta?ta.value.trim():'';
 if(!S.noteDraft)return;
 if(!t){if(ta){ta.focus();ta.setAttribute('placeholder','Type what should change first')}return}
 S.noteDraft.text=t;S.notes.push(S.noteDraft);S.noteDraft=null;render();
}
function applyNotes(){
 if(S.busy||!S.notes.length)return;
 S.busy=true;render();
 var all={};var scoped=0;var sel=null;
 var jobs=S.notes.map(function(n){return aiIntents(n.text,sel)});
 Promise.all(jobs).then(function(rs){
  rs.forEach(function(r){if(r.scope)scoped++;else Object.keys(r.changes||{}).forEach(function(k){all[k]=r.changes[k]})});
  S.busy=false;var cnt=S.notes.length;
  var out=applyAI(all,'notes');S.notes=[];S.tool=S.mode==='edit'?'select':'interact';
  if(out)showToast('Applied '+cnt+' note'+(cnt>1?'s':'')+': '+out.labels.join(' · ')+(scoped?' · '+scoped+' need developers':''),out.n);
  else showToast(scoped?'Those notes need developers, not design changes.':'Kerf couldn’t map those notes yet. Try cards, buttons, the heading or chips.');
  render();
 });
}

 });

  b.setAttribute('aria-pressed',String(String(c).toUpperCase()===String(b.getAttribute('data-v')).toUpperCase()));

function beginTextEdit(el){
 var k=el.getAttribute('data-k'),i=el.getAttribute('data-i'),orig=el.textContent,done=false;
 el.contentEditable='true';el.focus();
 var r=document.createRange();r.selectNodeContents(el);var sl=getSelection();sl.removeAllRanges();sl.addRange(r);
 function finish(save){if(done)return;done=true;el.removeEventListener('keydown',kd);el.removeEventListener('blur',bl);var v=el.textContent.trim();el.contentEditable='false';if(save&&v&&v!==orig)setText(ovKey(k,i,S.scope),v);else render()}
 function kd(ev){if(ev.key==='Enter'){ev.preventDefault();finish(true)}else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();finish(false)}}
 function bl(){finish(true)}
 el.addEventListener('keydown',kd);el.addEventListener('blur',bl);
}
/* drag to reorder: product cards in the grid, price and title inside a card */
var rd=null,suppressClick=false;
document.addEventListener('pointerdown',function(e){
 if(S.mode!=='edit'||S.tool!=='select'||S.view!=='canvas'||e.button!==0)return;
 var fc=document.getElementById('fc');if(!fc||!fc.contains(e.target)||e.target.isContentEditable)return;
 var el=e.target.closest('[data-k]');if(!el)return;var k=el.getAttribute('data-k');
 if(k!=='card'&&k!=='price'&&k!=='title'){var c=e.target.closest('.nf-card');if(c&&S.sel&&S.sel.k==='card'&&String(S.sel.i)===c.getAttribute('data-i')){el=c;k='card'}else return}
 var sibs=k==='card'?[].slice.call(fc.querySelectorAll('.nf-card')):[].slice.call(el.parentNode.querySelectorAll('[data-k="price"],[data-k="title"]'));
 rd={el:el,k:k,i:el.getAttribute('data-i'),x:e.clientX,y:e.clientY,sibs:sibs,on:false,fc:fc};
});
document.addEventListener('pointermove',function(e){
 if(!rd)return;
 if(!rd.on){if(Math.abs(e.clientX-rd.x)+Math.abs(e.clientY-rd.y)<6)return;rd.on=true;rd.el.classList.add('dragging');rd.line=document.createElement('div');rd.line.className='dropLine';rd.fc.appendChild(rd.line)}
 var best=null,bd=1e9;
 rd.sibs.forEach(function(s){if(s===rd.el)return;var r=s.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(e.clientX-cx,e.clientY-cy);if(d<bd){bd=d;best={s:s,r:r,cx:cx,cy:cy}}});
 if(!best)return;var fr=rd.fc.getBoundingClientRect(),r=best.r;
 if(rd.k==='card'){rd.after=e.clientX>best.cx;var x=(rd.after?r.right+6:r.left-6)-fr.left;rd.line.style.cssText='left:'+(x-1.5)+'px;top:'+(r.top-fr.top)+'px;width:3px;height:'+r.height+'px'}
 else{rd.after=e.clientY>best.cy;var y=(rd.after?r.bottom+2:r.top-2)-fr.top;rd.line.style.cssText='left:'+(r.left-fr.left)+'px;top:'+(y-1.5)+'px;width:'+r.width+'px;height:3px'}
 rd.target=best.s;
});
document.addEventListener('pointerup',function(){
 if(!rd)return;var d=rd;rd=null;if(!d.on)return;
 suppressClick=true;setTimeout(function(){suppressClick=false},0);
 if(d.line)d.line.remove();d.el.classList.remove('dragging');
 if(!d.target){render();return}
 if(d.k==='card'){var a=S.store.cardOrder.slice(),mi=Number(d.i),ti=Number(d.target.getAttribute('data-i'));a.splice(a.indexOf(mi),1);a.splice(a.indexOf(ti)+(d.after?1:0),0,mi);S.sel={k:'card',i:d.i};setOrder(a)}
 else{var pf=d.k==='price'?!d.after:d.after;S.sel={k:d.k,i:d.i};if(pf!==S.store.priceFirst)setStore('priceFirst',pf);else render()}
});
document.addEventListener('click',function(e){
 var t=e.target;
 if(suppressClick){suppressClick=false;e.preventDefault();return}
 var stage=document.getElementById('stage');
 // selection in edit mode
 if(S.mode==='edit'&&S.view==='canvas'&&S.tool==='select'){
  var fcEl=document.getElementById('fc');
  if(fcEl&&fcEl.contains(t)&&!t.closest('.anno')){
   if(t.closest('[contenteditable="true"]'))return;
   var el0=t.closest('[data-k]');
   if(el0&&S.sel&&S.sel.k===el0.getAttribute('data-k')&&String(S.sel.i)===String(el0.getAttribute('data-i'))){
    e.preventDefault();
    if(EDIT_TEXT[S.sel.k]){beginTextEdit(el0);return}
    if(DATA_TEXT[S.sel.k]){showToast('Product names and prices come from data/products.ts. Kerf edits design, not data.');render()}
    return;
   }
   e.preventDefault();var el=t.closest('[data-k]');
   if(el){var k=el.getAttribute('data-k');var i=el.getAttribute('data-i');
    if(['price','title','rating','image','button'].indexOf(k)>-1&&S.sel&&S.sel.k==='card'&&S.sel.i===i){}else if(S.sel&&S.sel.k==='card'&&S.sel.i===i&&k==='card'){}
    S.sel={k:k,i:i};S.insert=false;render()}else{S.sel=null;render()}
   return;
  }
 }
 var a=t.closest('[data-act]');if(!a)return;
 var act=a.getAttribute('data-act'),v=a.getAttribute('data-v');
 switch(act){
  case 'mode':setMode(v);break;
  case 'tool':
   if(v==='annotate'&&S.tool==='annotate'){S.tool=S.mode==='edit'?'select':'interact';S.noteDraft=null}else S.tool=v;
   S.flyout=false;S.insert=false;S.ask=false;if(v==='annotate')S.view='canvas';render();break;
  case 'shape':S.shape=v;S.tool='annotate';S.flyout=false;render();break;
  case 'flyout':S.flyout=!S.flyout;S.insert=false;render();break;
  case 'insert':S.insert=!S.insert;S.flyout=false;render();break;
  case 'insertItem':S.insert=false;setStore(v,!S.store[v]);S.sel={k:v==='rating'?'rating':'image',i:'0'};if(!S.store[v])S.sel=null;render();break;
  case 'width':S.width=v;render();break;
  case 'history':if(S.view==='history'){S.view='canvas'}else{finalizeDraft();S.view='history';S.hv=null;S.ask=false}render();break;
  case 'closeHistory':S.view='canvas';render();break;
  case 'pr':finalizeDraft();S.pr=true;S.prDone=false;render();break;
  case 'closePr':S.pr=false;S.prDone=false;render();break;
  case 'createPr':S.prDone=true;render();break;
  case 'tab':S.tab=v;render();break;
  case 'chatTab':S.tab=S.tab==='chat'?'design':'chat';render();break;
  case 'ask':S.ask=!S.ask;S.toast=null;render();break;
  case 'askSend':runRequest((document.getElementById('askInput')||{}).value,'ask');break;
  case 'askSuggest':runRequest(v,'ask');break;
  case 'micAsk':simulateVoiceInto('askInput');break;
  case 'chatSend':runRequest((document.getElementById('chatInput')||{}).value,'chat');break;
  case 'chatSuggest':runRequest(v,'chat');break;
  case 'micChat':simulateVoiceInto('chatInput');break;
  case 'scopeNote':S.scopeNotes=(S.scopeNotes?S.scopeNotes+'; ':'')+'a working discount code field at checkout';S.chat.push({role:'kerf',kind:'noted'});render();break;
  case 'layer':S.sel={k:v,i:'0'};render();break;
  case 'scope':S.scope=v;render();break;
  case 'moveCard':moveCard(S.sel.i,Number(v));break;
  case 'pset':var pk=a.getAttribute('data-pk');var pv=/^(fontWeight)$/.test(pk)?Number(v):v;setOv(curId(),pk,pv);break;
  case 'pstep':var pp=a.getAttribute('data-key');var P=PROPS[pp];var cur=curOv(pp);if(cur==null)cur=readProp(pp,S._el);var step=(pp==='fontSize'||pp==='lineHeight'||pp==='borderW'||pp==='letterSpacing')?1:pp==='opacity'?10:4;setOv(curId(),pp,Math.max(P.min==null?0:P.min,Math.min(P.max,Number(cur)+Number(a.getAttribute('data-d'))*step)));break;
  case 'pclear':var id=curId();Object.keys(S.store.ov[id]||{}).forEach(function(q){setOv(id,q,null,true)});if(S.store.text[id]!=null)setText(id,null);else render();break;
  case 'deselect':S.sel=null;render();break;
  case 'set':var key=a.getAttribute('data-key');var val=v==='true'?true:v==='false'?false:v;setStore(key,val);break;
  case 'step':var sk=a.getAttribute('data-key');var d=Number(a.getAttribute('data-d'))*(sk==='headingSize'?4:2);var L=LIMITS[sk];setStore(sk,Math.max(L[0],Math.min(L[1],S.store[sk]+d)));break;
  case 'rule':S.rule=false;showToast(v==='all'?'Price above Title is now the rule for ProductCard on all 4 screens':'Kept on /shop only. Kerf will create a ProductCard variant for this page');render();break;
  case 'undo':var n=Number(v);if(undoVersion(n)){S.chat.forEach(function(m){if(m.n===n)m.undone=true});S.toast=null;S.hv=null;if(S.view==='history'&&S.versions.length<2){}render()}break;
  case 'compare':S.view='history';S.hv=Number(v)-1;S.toast=null;render();break;
  case 'toastClose':S.toast=null;render();break;
  case 'selVer':S.hv=Number(v);render();break;
  case 'restore':var vv=S.versions[Number(v)];finalizeDraft();var labels=diffFrom(S.store,vv.store);if(labels.length){S.store=clone(vv.store);S.versions.push({n:S.versions.length+1,time:now(),changes:['Restored Version '+vv.n],store:clone(S.store),source:'restore'});S.hv=null}render();break;
  case 'cmpMode':S.cmpMode=v;render();break;
  case 'cart':if(S.mode==='preview'&&S.tool==='interact'){S.cart++;render()}break;
  case 'cat':if(S.mode==='preview'&&S.tool==='interact'){S.cat=v;render()}break;
  case 'mic':simulateVoice(function(txt){if(S.noteDraft){S.noteDraft.text=txt;render()}});break;
  case 'noteAdd':addNote();break;
  case 'noteDiscard':S.noteDraft=null;render();break;
  case 'notesApply':applyNotes();break;
  case 'notesClear':S.notes=[];render();break;
 }
});
function diffFrom(a,b){return Object.keys(BASE).filter(function(k){return JSON.stringify(a[k])!==JSON.stringify(b[k])})}
function simulateVoiceInto(id){
 var el=document.getElementById(id);if(!el)return;var txt='Make the add to cart buttons solid black';el.value='';el.placeholder='Listening… (voice is simulated here)';
 var i=0;var iv=setInterval(function(){i+=2;el.value=txt.slice(0,i);if(i>=txt.length){clearInterval(iv);el.placeholder='';el.focus()}},45);
}
document.addEventListener('change',function(e){
 if(e.target.getAttribute&&e.target.getAttribute('data-textedit')&&S.sel){var tv=e.target.value.trim();if(tv)setText(ovKey(S.sel.k,S.sel.i,S.scope),tv);return}
 var pr=e.target.getAttribute&&e.target.getAttribute('data-prop');
 if(pr&&S.sel){var raw=e.target.value.trim();
  if(e.target.getAttribute('data-color')){var hx=raw.replace(/^#/,'');if(/^[0-9a-f]{6}$/i.test(hx))setOv(curId(),pr,'#'+hx.toUpperCase());else render();return}
  var nv=parseInt(raw,10);if(isNaN(nv)){render();return}var PP=PROPS[pr];setOv(curId(),pr,Math.max(PP.min==null?0:PP.min,Math.min(PP.max,nv)));return}
 var k=e.target.getAttribute&&e.target.getAttribute('data-num');if(!k)return;
 var n=parseInt(e.target.value,10);var L=LIMITS[k];if(isNaN(n)){render();return}
 setStore(k,Math.max(L[0],Math.min(L[1],n)));
});
document.addEventListener('input',function(e){
 if(e.target.id==='noteText'){var ip=document.getElementById('interp');if(ip)ip.textContent=describe(e.target.value);if(S.noteDraft)S.noteDraft.text=e.target.value}
 if(e.target.id==='cmpRange'){S.cmp=Number(e.target.value);var b=document.getElementById('layerB'),l=document.getElementById('cmpLine'),kn=document.getElementById('cmpKnob');if(b)b.style.clipPath='inset(0 0 0 '+S.cmp+'%)';if(l)l.style.left=S.cmp+'%';if(kn)kn.style.left=S.cmp+'%'}
});
document.addEventListener('keydown',function(e){
 var tag=(e.target.tagName||'').toLowerCase();var typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
 if(typing&&e.target.isContentEditable)return;
 if(S.mode==='edit'&&S.sel&&!typing&&e.key==='Enter'&&EDIT_TEXT[S.sel.k]&&S._el){e.preventDefault();beginTextEdit(S._el);return}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(S.mode==='edit'){S.tab='chat';render();var ci=document.getElementById('chatInput');if(ci)ci.focus()}else{S.ask=true;render()}return}
 if(e.key==='Enter'&&!e.shiftKey){
  if(e.target.id==='chatInput'){e.preventDefault();runRequest(e.target.value,'chat');return}
  if(e.target.id==='askInput'){e.preventDefault();runRequest(e.target.value,'ask');return}
  if(e.target.id==='noteText'){e.preventDefault();addNote();return}
  if(e.target.getAttribute('data-act')==='selVer'){e.target.click();return}
 }
 if(e.key==='Escape'){
  if(S.pr){S.pr=false;render();return}
  if(S.noteDraft){S.noteDraft=null;render();return}
  if(S.ask||S.insert||S.flyout){S.ask=false;S.insert=false;S.flyout=false;render();return}
  if(S.tool==='annotate'){S.tool=S.mode==='edit'?'select':'interact';render();return}
  if(S.view==='history'){S.view='canvas';render();return}
  if(S.sel){S.sel=null;render();return}
  return;
 }
 if(typing||e.metaKey||e.ctrlKey||e.altKey||S.pr)return;
 var k=e.key.toLowerCase();
 if(k==='e')setMode('edit');else if(k==='p')setMode('preview');
 else if(k==='a'){S.tool=S.tool==='annotate'?(S.mode==='edit'?'select':'interact'):'annotate';S.view='canvas';S.noteDraft=null;render()}
 else if(k==='v'){S.tool=S.mode==='edit'?'select':'interact';render()}
 else if(k==='h'&&S.mode==='edit'){S.tool='hand';render()}
 else if(k==='i'&&S.mode==='edit'){S.insert=!S.insert;render()}
 else if(S.tool==='annotate'&&['1','2','3','4'].indexOf(k)>-1){S.shape=['pin','circle','box','arrow'][Number(k)-1];render()}
});
/* drawing + hand */
var drag=null;
document.addEventListener('pointerdown',function(e){
 var anno=document.getElementById('anno');
 if(S.tool==='annotate'&&anno&&anno.contains(e.target)&&!e.target.closest('.notePop')&&!e.target.closest('.pin')){
  if(S.noteDraft){S.noteDraft=null}
  var r=anno.getBoundingClientRect();drag={kind:'draw',x:e.clientX-r.left,y:e.clientY-r.top,r:r};e.preventDefault();return;
 }
 var fr=document.getElementById('frame');
 if(S.tool==='hand'&&fr&&fr.contains(e.target)){drag={kind:'pan',y:e.clientY,st:fr.scrollTop,f:fr};e.preventDefault()}
});
document.addEventListener('pointermove',function(e){
 if(!drag)return;
 if(drag.kind==='pan'){drag.f.scrollTop=drag.st-(e.clientY-drag.y);return}
 var x=e.clientX-drag.r.left,y=e.clientY-drag.r.top;drag.cx=x;drag.cy=y;
 var svg=document.querySelector('#anno svg');if(!svg)return;
 var n=mkShape(drag.x,drag.y,x,y);var tmp=document.getElementById('tmpShape');
 if(!tmp){tmp=document.createElementNS('http://www.w3.org/2000/svg','g');tmp.id='tmpShape';svg.appendChild(tmp)}
 tmp.innerHTML=shapeSVG(n);
});
document.addEventListener('pointerup',function(e){
 if(!drag)return;var d=drag;drag=null;if(d.kind!=='draw')return;
 var x=d.cx==null?d.x:d.cx,y=d.cy==null?d.y:d.cy;
 var n=mkShape(d.x,d.y,x,y);
 if(Math.abs(x-d.x)<8&&Math.abs(y-d.y)<8){n={shape:'pin',x:d.x,y:d.y}}
 n.num=S.notes.length+1;n.text='';S.noteDraft=n;render();
});
function mkShape(x1,y1,x2,y2){
 if(S.shape==='arrow')return {shape:'arrow',x:x1,y:y1,dx:x2-x1,dy:y2-y1};
 if(S.shape==='pin')return {shape:'pin',x:x2,y:y2};
 return {shape:S.shape,x:Math.min(x1,x2),y:Math.min(y1,y2),w:Math.abs(x2-x1),h:Math.abs(y2-y1)};
}
render();
})();
