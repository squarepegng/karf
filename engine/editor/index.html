<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/__kerf/editor.css">
</head>
<body>
<div id="kerf">
  <header id="top"></header>
  <div id="body">
    <aside class="side l" id="layers" hidden></aside>
    <main id="stage">
      <div id="canvas"><div id="sizer"></div>
      <div class="bezel" id="bezel" hidden aria-hidden="true"><div class="screen"><div class="status"><span class="time">9:41</span><span class="date"></span><span class="sicons"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.3-2.6a3.3 3.3 0 0 0-4.6 0zM3.4 6.7a6.6 6.6 0 0 1 9.2 0l1.6-1.8a9 9 0 0 0-12.4 0zM.2 3.1a11 11 0 0 1 15.6 0L16 2.9A13.4 13.4 0 0 0 0 2.9z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2"/><path d="M24.5 4.5v4a2 2 0 0 0 0-4z" opacity=".5"/></svg></span></div><div class="island"></div><div class="home"></div></div></div>
      <div id="frameBox">
        <iframe id="frame" title="Your app" src="/"></iframe>
        <div id="ov">
          <div class="box hov" id="hov"><span class="tag"></span></div>
          <div id="sibs"></div>
          <div class="box sel" id="sel"><span class="tag"></span><i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><span class="dim"></span></div>
          <div id="amb"></div>
          <svg class="marks" id="marks" width="100%" height="100%"><g id="marksG"></g></svg>
          <div class="dropLine" id="dropLine" hidden></div>
          <div id="multi"></div>
          <svg class="marks" width="100%" height="100%"><g id="measG"></g></svg>
          <div class="padShade" id="padShade" hidden></div>
          <div id="handles" hidden>
            <span class="hdl pad v" id="hPadL" data-handle="padL" title="Drag to change padding"></span><span class="hdl pad v" id="hPadR" data-handle="padR" title="Drag to change padding"></span>
            <span class="hdl pad h" id="hPadT" data-handle="padT" title="Drag to change padding"></span><span class="hdl pad h" id="hPadB" data-handle="padB" title="Drag to change padding"></span>
            <span class="hdl size" id="hW" data-handle="w" title="Drag to set width"></span><span class="hdl size" id="hH" data-handle="h" title="Drag to set height"></span><span class="hdl corner" id="hWH" data-handle="wh" title="Drag to resize"></span>
          </div>
          <div class="dragLabel" id="dragLabel" hidden></div>
          <div class="annoCap" id="annoCap" hidden></div>
          <div class="notePop" id="notePop" hidden></div>
        </div>
        <div class="peekBar" id="peekBar" hidden></div>
      </div>
      <div class="devLabel" id="devLabel"></div>
      </div>
      <div class="hint" id="hint" hidden></div>
      <div class="ask" id="ask" hidden></div>
      <div class="notesChip" id="notesChip" hidden></div>
      <div class="noteRes" id="noteRes" hidden></div>
      <div class="bar" id="bar"></div>
      <div class="pop" id="changes" hidden></div>
      <div class="toast" id="toast" hidden></div>
      <button class="helpBtn" id="helpBtn" data-act="shortcuts" title="Keyboard shortcuts · ?" aria-label="Keyboard shortcuts">?</button>
    </main>
    <aside class="side r" id="panel" hidden></aside>
  </div>
  <div class="scrim" id="modal" hidden></div>
  <div class="menu" id="menu" hidden role="menu"></div>
</div>
<script src="/__kerf/editor.js"></script>
</body>
</html>
